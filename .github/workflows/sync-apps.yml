name: Sync Apps, Logos & Trigger FluentDeck

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run app metadata & newly added apps synchronizer
        run: python sync_apps.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apps_logo.yml README.md
          if git diff --staged --quiet; then
            echo "No changes to commit in apps_logo.yml or README.md"
          else
            git commit -m "Auto-update apps_logo.yml & sync Newly Added Apps section"
            git push
          fi

      - name: Trigger FluentDeck App Sync
        if: success() && env.SYNC_PAT != ''
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          echo "Dispatching upstream update event to fluentdeck..."
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.SYNC_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/jishnu-kv/fluentdeck/dispatches \
            -d '{"event_type":"upstream-apps-updated"}'

